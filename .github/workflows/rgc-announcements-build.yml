name: Build RGC Announcement apps

on:
  push:
    paths: ["announcement-system/**", ".github/workflows/rgc-announcements-build.yml"]
  pull_request:
    paths: ["announcement-system/**", ".github/workflows/rgc-announcements-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: announcement-system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build RGC.sln -c Release

      - name: Publish Windows packages
        shell: pwsh
        run: ./deploy/Publish.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: RGC-AdminConsole-win-x64
          path: announcement-system/publish/AdminConsole

      - uses: actions/upload-artifact@v4
        with:
          name: RGC-Agent-win-x64
          path: announcement-system/publish/Agent

      - uses: actions/upload-artifact@v4
        with:
          name: RGC-Server-win-x64
          path: announcement-system/publish/Server
