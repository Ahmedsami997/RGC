name: Build RGC Server container

# Publishes the server as a container image to GitHub Container Registry:
#   ghcr.io/<owner>/rgc-server:latest
# Azure Container Apps (or any Docker host) runs this image.

on:
  push:
    paths: ["announcement-system/src/RGC.Server/**", "announcement-system/src/RGC.Shared/**",
            "announcement-system/deploy/server.Dockerfile", ".github/workflows/rgc-server-container.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rgc-server" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: announcement-system
          file: announcement-system/deploy/server.Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
